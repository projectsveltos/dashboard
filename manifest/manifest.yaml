apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: projectsveltos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-dist
          image: docker.io/projectsveltos/dashboard:v1.17.0
          command: ["sh", "-c", "cp -R /app/dist/. /work/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dist
              mountPath: /work
      containers:
        - name: dashboard
          image: docker.io/projectsveltos/dashboard:v1.17.0
          ports:
            - containerPort: 5173
          env:
            - name: VITE_APP_VERSION
              value: v1.17.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dist
              mountPath: /app/dist
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-run
              mountPath: /run/nginx
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
            - name: nginx-log
              mountPath: /var/log/nginx
      volumes:
        - name: dist
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: projectsveltos
spec:
  selector:
    app: dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
  type: ClusterIP
